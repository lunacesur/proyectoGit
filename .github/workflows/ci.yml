name: CI

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - develop
  workflow_dispatch: {}

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Añadir feature al README
        if: github.event_name == 'pull_request'
        env:
          FEATURE_BRANCH: ${{ github.head_ref }}
        run: |
          LINE="Añadida feature: $FEATURE_BRANCH"
          if ! grep -Fxq "$LINE" README.md; then
            echo "$LINE" >> README.md
          fi
          
      - name: Guardar cambios
        if: github.event_name == 'pull_request'
        env:
          FEATURE_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$FEATURE_BRANCH"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "ci: actualizar README con la feature"
          fi

          git pull --rebase origin "$FEATURE_BRANCH"
          git push origin HEAD:"$FEATURE_BRANCH"

  validate-dev:
    runs-on: self-hosted
    needs: update-readme
    steps:
      - name: Validar token de desarrollo
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        shell: powershell
        run: |
          $LOCAL_DEV_TOKEN = $env:LOCAL_DEV_TOKEN

          if ([string]::IsNullOrEmpty($env:DEV_TOKEN) -or
              [string]::IsNullOrEmpty($LOCAL_DEV_TOKEN)) {
            Write-Error "Error: falta DEV_TOKEN o LOCAL_DEV_TOKEN"
            exit 1
          }

          if ($env:DEV_TOKEN -ceq $LOCAL_DEV_TOKEN) {
            Write-Host "Token de desarrollo validado correctamente"
          }
          else {
            Write-Error "Error: los tokens de desarrollo no coinciden"
            exit 1
          }
