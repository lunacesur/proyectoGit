name: CI Workflow

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Añadir feature al README
        if: github.event_name == 'pull_request'
        env:
          FEATURE_BRANCH: ${{ github.head_ref }}
        run: |
          LINE="Añadida feature: $FEATURE_BRANCH"
          if ! grep -Fxq "$LINE" README.md; then
            echo "$LINE" >> README.md
          fi

      - name: Guardar cambios
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEATURE_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            gh api \
              --method PUT \
              "repos/${GITHUB_REPOSITORY}/contents/README.md" \
              -f message="ci: actualizar README con feature" \
              -f content="$(base64 -w 0 README.md)" \
              -f branch="$FEATURE_BRANCH" \
              -f sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/README.md?ref=${FEATURE_BRANCH}" --jq .sha)"
          fi

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar DEV_TOKEN en Runner Self-Hosted
        run: |
          if [ "$LOCAL_DEV_TOKEN" = "${{ secrets.DEV_TOKEN }}" ]; then
            echo "Token DEV verificado correctamente."
            exit 0
          else
            echo "Error: El token DEV local no coincide con el secret."
            exit 1
          fi
