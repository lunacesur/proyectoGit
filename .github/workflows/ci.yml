name: CI Workflow

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Añadir feature al README
        if: github.event_name == 'pull_request'
        env:
          FEATURE_BRANCH: ${{ github.head_ref }}
        run: |
          LINE="Añadida feature: $FEATURE_BRANCH"
          if ! grep -Fxq "$LINE" README.md; then
            echo "$LINE" >> README.md
          fi
          
      - name: Guardar cambios
        if: github.event_name == 'pull_request'
        env:
          FEATURE_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$FEATURE_BRANCH"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "ci: actualizar README con la feature"
          fi

          git pull --rebase origin "$FEATURE_BRANCH"
          git push origin HEAD:"$FEATURE_BRANCH"

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar DEV_TOKEN en Runner Self-Hosted
        shell: bash
        run: |
          if [ "$LOCAL_DEV_TOKEN" = "${{ secrets.DEV_TOKEN }}" ]; then
            echo "Token DEV verificado correctamente."
            exit 0
          else
            echo "Error: El token DEV local no coincide con el secret."
            exit 1
          fi
