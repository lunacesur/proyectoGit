name: CI Workflow

on:
  push:
    branches: [ develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ develop ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar README.md
        run: |
          # Limpiar cualquier cambio residual en el runner
          git checkout -- . || true
          git clean -fd || true

          # Obtener nombre de la rama
          if [ -n "$GITHUB_HEAD_REF" ]; then
            BRANCH_NAME="$GITHUB_HEAD_REF"
          else
            BRANCH_NAME=$(git log -1 --pretty=%B | grep -oE 'feature/[a-zA-Z0-9_-]+' || echo "mi-feature")
          fi

          # Añadir línea al README
          echo "" >> README.md
          echo "Añadida feature: $BRANCH_NAME" >> README.md

          # Guardar y subir directamente sin rebase
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: actualizar README con feature [$BRANCH_NAME]"
          git push origin develop

      - name: Commit y push del README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git checkout $TARGET_BRANCH || git checkout -b $TARGET_BRANCH
          
          git add README.md
          if ! git diff --quiet --staged; then
            git commit -m "docs: actualizar README con feature [$TARGET_BRANCH]"
            git pull origin $TARGET_BRANCH --rebase
            git push origin $TARGET_BRANCH
          fi

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar DEV_TOKEN
        run: |
          echo "Validando DEV_TOKEN..."
          if [ "$LOCAL_DEV_TOKEN" = "${{ secrets.DEV_TOKEN }}" ]; then
            echo "DEV_TOKEN válido"
          else
            echo "Error: LOCAL_DEV_TOKEN no coincide con DEV_TOKEN"
            exit 1
          fi
