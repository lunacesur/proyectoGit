name: CD on: pull_request: branches: - main types: - opened - synchronize - reopened push: branches: - main workflow_dispatch: jobs: update-version: runs-on: ubuntu-latest steps: - name: Descargar repositorio uses: actions/checkout@v4 - name: Actualizar versión run: | FECHA=$(date '+%Y-%m-%d %H:%M:%S') if grep -q '^AppVersion-[0-9]\+$' README.md; then VERSION=$(grep -o '^AppVersion-[0-9]\+$' README.md | head -n 1 | cut -d '-' -f 2) NUEVA_VERSION=$((VERSION + 1)) sed -i "s/^AppVersion-$VERSION$/AppVersion-$NUEVA_VERSION/" README.md else echo "Error: no se encuentra AppVersion en README.md" exit 1 fi echo "Última actualización: $FECHA" >> README.md - name: Guardar cambios de versión run: | git config user.name "github-actions[bot]" git config user.email "41898282+github-actions[bot]@users.noreply.github.com" git add README.md git diff --cached --quiet || git commit -m "Actualizar versión de la aplicación" git push origin HEAD:${{ github.event.pull_request.base.ref || github.ref_name }} validate-prod: runs-on: self-hosted needs: update-version steps: - name: Validar token de producción env: PROD_TOKEN: ${{ secrets.PROD_TOKEN }} LOCAL_PROD_TOKEN: ${{ vars.LOCAL_PROD_TOKEN }} run: | if [ "$PROD_TOKEN" = "$LOCAL_PROD_TOKEN" ] && [ -n "$PROD_TOKEN" ]; then echo "Token de producción válido" else echo "Error: el token de producción no coincide" exit 1 fi
