name: CD Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Incrementar versión en README.md
        run: |
          CURRENT_DATE=$(date +'%Y-%m-%d %H:%M:%S')
          if grep -q "AppVersion-" README.md; then
            LAST_VER=$(grep -o 'AppVersion-[0-9]*' README.md | tail -n 1 | cut -d'-' -f2)
            NEW_VER=$((LAST_VER + 1))
            echo "AppVersion-$NEW_VER ($CURRENT_DATE)" >> README.md
          else
            echo "AppVersion-1 ($CURRENT_DATE)" >> README.md
          fi

      - name: Commit y push de la versión
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git checkout $TARGET_BRANCH || git checkout -b $TARGET_BRANCH
          
          git add README.md
          if ! git diff --quiet --staged; then
            git commit -m "chore: incremento de versión en README [$TARGET_BRANCH]"
            git pull origin $TARGET_BRANCH --rebase
            git push origin $TARGET_BRANCH
          fi

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    steps:
      - name: Validar PROD_TOKEN
        run: |
          echo "Validando PROD_TOKEN..."
          if [ "$LOCAL_PROD_TOKEN" = "${{ secrets.PROD_TOKEN }}" ]; then
            echo "PROD_TOKEN válido"
          else
            echo "Error: LOCAL_PROD_TOKEN no coincide con PROD_TOKEN"
            exit 1
          fi
