name: CD

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Incrementar versión del README
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if ! grep -q '^AppVersion-[0-9]\+$' README.md; then
            echo "Error: no se encuentra AppVersion-N en README.md"
            exit 1
          fi

          VERSION=$(grep '^AppVersion-[0-9]\+$' README.md | head -n 1 | sed 's/AppVersion-//')
          NEXT_VERSION=$((VERSION + 1))
          sed -i "s/^AppVersion-$VERSION$/AppVersion-$NEXT_VERSION/" README.md

          echo "Fecha y hora de actualización: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> README.md

      - name: Guardar nueva versión
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "cd: incrementar versión"
            git push origin HEAD:main
          fi

  validate-prod:
    runs-on: self-hosted
    needs: update-version

    steps:
      - name: Validar token de producción
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PROD_TOKEN" ] || [ -z "$LOCAL_PROD_TOKEN" ]; then
            echo "Error: falta PROD_TOKEN o LOCAL_PROD_TOKEN"
            exit 1
          fi

          if [ "$PROD_TOKEN" = "$LOCAL_PROD_TOKEN" ]; then
            echo "Token de producción validado correctamente"
          else
            echo "Error: los tokens de producción no coinciden"
            exit 1
          fi
