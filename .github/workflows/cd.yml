name: CD

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar nueva versión
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git pull --rebase origin main

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "cd: incrementar versión"
          fi

          git push origin HEAD:main

  validate-prod:
    runs-on: self-hosted
    needs: update-version

    steps:
      - name: Validar PROD_TOKEN en Runner Self-Hosted
        run: |
          if ($env:LOCAL_PROD_TOKEN -eq "${{ secrets.PROD_TOKEN }}") {
            echo "Token PROD verificado correctamente."
            exit 0
          } else {
            echo "Error: El token PROD local no coincide con el secret."
            exit 1
          }
